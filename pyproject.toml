[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subspacead"
version = "0.1.0"
description = "SubspaceAD Codebase"
dependencies = [
    "numpy<2",
    "scipy<1.15",
    "scikit-learn<1.6",
    "pandas<2.3",
    "Pillow",
    "opencv-python-headless",
    "kornia",
    "tqdm",
    "transformers==4.52.2",
    "huggingface_hub<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
