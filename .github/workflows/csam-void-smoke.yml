name: CSAM experiment smoke test
on:
  pull_request:
    paths:
      - 'models/csam_void/**'
      - '.github/workflows/csam-void-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r models/csam_void/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s models/csam_void -p test_run.py -v
      - name: Generate synthetic dataset and local random backbone weights
        run: |
          python models/csam_void/make_demo.py --out /tmp/csam_demo
          python -c "import torch; from torchvision.models import resnet18; torch.manual_seed(42); torch.save(resnet18(weights=None).state_dict(), '/tmp/csam_resnet18.pt')"
      - name: End-to-end smoke test (pooled and all holdouts)
        run: |
          python models/csam_void/run.py --manifest /tmp/csam_demo/manifest.csv --out /tmp/csam_results --epochs 2 --min-steps 2 --padim-size 64 --padim-dim 16 --padim-weights /tmp/csam_resnet18.pt --protocol both --device cpu --experiments exp0_padim exp1_cnn exp2_normals exp3_hard_negative exp4_copy_paste exp5_domain_aug exp6_mixstyle
          python models/csam_void/check_smoke.py /tmp/csam_results
      - name: Semi-supervised smoke test
        run: |
          python models/csam_void/run.py --manifest /tmp/csam_demo/manifest.csv --out /tmp/csam_semi --epochs 4 --min-steps 4 --protocol pooled --device cpu --experiments exp7_semi || test "$?" -eq 2
          python models/csam_void/check_smoke.py /tmp/csam_semi --semi
      - name: Upload synthetic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csam-synthetic-reports
          path: |
            /tmp/csam_results/
            /tmp/csam_semi/
          retention-days: 3
