name: NAGL training smoke test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  nagl-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Train and reload NAGL on two synthetic equipment groups
        run: |
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r models/nagl/requirements.txt
          python experiments/nagl/make_demo.py --out datasets/demo
          python models/nagl/run.py check --manifest datasets/demo/manifest.csv --by-equipment
          python models/nagl/run.py train --manifest datasets/demo/manifest.csv --by-equipment --epochs 1 --out results/demo
          python models/nagl/run.py eval --manifest datasets/demo/manifest.csv --checkpoint results/demo/best.pt --out results/demo/test
          python -c "import numpy as np; from pathlib import Path; m=list(Path('results/demo/test/maps').glob('*.npy')); assert len(m)==4 and all(np.load(p).shape==(81,61) for p in m)"
