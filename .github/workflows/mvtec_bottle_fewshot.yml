name: MVTec bottle few-shot CPU experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mvtec_bottle_fewshot.yml"
      - "tools/prepare_bottle_subset.py"
      - "tools/summarize_fewshot.py"

permissions:
  contents: read

jobs:
  bottle-fewshot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install minimum inference dependencies
        run: |
          python -m pip install "numpy<2" "scipy<1.15" "scikit-learn<1.6" \
            "pandas<2.3" Pillow "opencv-python-headless==4.10.0.84" kornia \
            tqdm "transformers==4.52.2" "huggingface_hub<1.0"
          python -m pip install --no-deps -e .
      - name: Check DINOv2-with-registers model import compatibility
        run: |
          python -c 'import torch; from transformers import Dinov2WithRegistersModel; print("torch", torch.__version__)'
      - name: Download only MVTec AD bottle images from public mirror
        run: python tools/prepare_bottle_subset.py
      - name: Run the official PCA anomaly scoring pipeline
        run: |
          for SHOTS in 1 2 4; do
            python main.py \
              --dataset_name mvtec_ad \
              --dataset_path datasets/mvtec-bottle-subset \
              --categories bottle \
              --model_ckpt facebook/dinov2-with-registers-small \
              --image_res 224 \
              --layers=-1,-2,-3 \
              --batch_size 2 \
              --seed 42 \
              --k_shot "$SHOTS" \
              --aug_count 0 \
              --pca_ev 0.99 \
              --no_log_file \
              --outdir "results/bottle_"$SHOTS"shot"
          done
      - name: Summarize scores
        run: python tools/summarize_fewshot.py
      - name: Upload metrics and data provenance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottle-fewshot-metrics
          path: |
            results/dataset_manifest.json
            results/bottle_fewshot_summary.csv
            results/bottle_*shot/**/benchmark_results.csv
          if-no-files-found: warn
